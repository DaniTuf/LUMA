server {
  listen 80;
  server_name _;
  include /etc/nginx/luma-common.conf;
}

# HTTPS (browsers only allow the microphone on https or localhost). The certificate is made on first start by
# 40-luma-cert.sh into the mounted /certs folder; put a real certificate there (luma.crt / luma.key) to replace it.
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /certs/luma.crt;
  ssl_certificate_key /certs/luma.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  include /etc/nginx/luma-common.conf;
}
