  root /usr/share/nginx/html;
  index index.html;

  # Images and fonts: long cache.
  location ~* \.(png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # JS and CSS: always revalidate (cheap 304 via ETag). They used to be "immutable for 1 year", which meant a new
  # deployment never reached students whose browsers already had the old app.js.
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache";
  }

  # Proxy API calls to the backend (also the WebSockets of the live teacher)
  location /api/ {
    proxy_pass http://luma_backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1300s;               # a live lesson can last 20 minutes

    # Pass streamed chat tokens straight through instead of holding them until the reply ends
    proxy_buffering off;
    proxy_cache off;
    gzip off;
  }

  # Serve index.html for all other routes (SPA routing)
  location / {
    add_header Cache-Control "no-cache";   # index.html must revalidate, or browsers keep an old page (and an old app.js) for days
    try_files $uri $uri/ /index.html;
  }
