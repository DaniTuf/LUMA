[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Browser tests run in their own process (Playwright's sync API keeps an event loop alive):
#   python -m pytest -q                      backend tests (fast, no network, no browser)
#   python -m pytest tests/e2e -m e2e -q     real-browser tests on laptop and phone-sized touch devices
addopts = -m "not e2e" --timeout=25
filterwarnings =
    ignore::DeprecationWarning
markers =
    e2e: browser tests (Playwright)

